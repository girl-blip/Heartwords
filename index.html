<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeartWords - Premium Poetry</title>
<style>
  :root { -cyan: #ff9ecb; --cyan: #e91e63; --gold: #FFD700; --bg: #fff5f9; }
    * { box-sizing: border-box; }
  body { font-family: 'Poppins', Arial, sans-serif; background: var(--bg); margin: 0; color: #333; }
  header { background: linear-gradient(135deg, var(--pink), var(--dark-pink)); color: white; text-align: center; padding: 30px 20px; position: relative; }
 .premium-badge { position: absolute; top: 15px; right: 15px; background: var(--gold); color: #000; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
 .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
 .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
 .tab { padding: 10px 20px; border: 2px solid var(--dark-pink); border-radius: 20px; background: white; color: var(--dark-pink); cursor: pointer; font-weight: 600; }
 .tab.active { background: var(--dark-pink); color: white; }
 .poem-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(233,30,99,0.1); position: relative; }
 .poem-title { color: var(--dark-pink); font-size: 1.4em; margin: 0 0 5px; }
 .poem-text { white-space: pre-line; line-height: 1.8; }
 .heart-btn { position: absolute; top: 15px; right: 15px; font-size: 28px; cursor: pointer; color: #ddd; }
 .heart-btn.active { color: var(--dark-pink); }
 .section { display: none; }
 .section.active { display: block; }
 .empty { text-align: center; color: #999; padding: 50px 20px; }
  textarea, input, select { width: 100%; padding: 12px; border: 2px solid #ffd6e8; border-radius: 8px; margin-bottom: 10px; }
 .btn { background: var(--dark-pink); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: 600; margin: 5px; }

  /* REAL CHAT STYLES */
 .chat-box { background: white; border-radius: 15px; padding: 15px; height: 500px; display: flex; flex-direction: column; }
 .chat-messages { flex: 1; overflow-y: auto; padding: 10px; background: #fff0f5; border-radius: 10px; margin-bottom: 10px; }
 .chat-msg { background: #ffe0eb; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; max-width: 80%; }
 .chat-msg.you { background: var(--dark-pink); color: white; margin-left: auto; }
 .chat-input { display: flex; gap: 10px; }
 .online-dot { width: 8px; height: 8px; background: #00b894; border-radius: 50%; display: inline-block; margin-right: 5px; }
</style>
</head>
<body>

<header>
  <div class="premium-badge">PREMIUM ✨</div>
  <h1>Heartwords</h1>
  <p>Save the words that touch your heart</p>
</header>

<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="showTab('poems', this)">Poems</div>
    <div class="tab" onclick="showTab('write', this)">Write</div>
    <div class="tab" onclick="showTab('heartwords', this)">❤️ Heartwords</div>
    <div class="tab" onclick="showTab('chat', this)">💬 Live Chat</div>
  </div>

  <div id="poems" class="section active">
    <div id="poemsGrid">Loading...</div>
  </div>

  <div id="write" class="section">
    <h2>Write a Poem</h2>
    <input type="text" id="title" placeholder="Poem Title">
    <textarea id="text" rows="6" placeholder="Write your poem here..."></textarea>
    <button class="btn" onclick="addPoem()">Publish</button>
  </div>

  <div id="heartwords" class="section">
    <h2>Your Heartwords</h2>
    <div id="heartGrid"></div>
  </div>

  <div id="chat" class="section">
    <h2><span class="online-dot"></span>Heartwords Live Chat</h2>
    <p style="text-align:center;color:#666;">Talk to others who understand 💖</p>
    <div class="chat-box">
      <div class="chat-messages" id="chatMessages">Connecting...</div>
      <div class="chat-input">
        <input type="text" id="chatName" placeholder="Your nickname" maxlength="15">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChat()">
        <button class="btn" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>
</div>

<!-- FIREBASE SDK - YOUR KEYS ARE ALREADY INSIDE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // YOUR FIREBASE CONFIG - ALREADY PASTED
  const firebaseConfig = {
    apiKey: "AIzaSyAjFRvZuwJT_iYW7sWYGbFPCCsjBVE4Fps",
    authDomain: "heartwords-6b186.firebaseapp.com",
    databaseURL: "https://heartwords-6b186-default-rtdb.firebaseio.com",
    projectId: "heartwords-6b186",
    storageBucket: "heartwords-6b186.firebasestorage.app",
    messagingSenderId: "137574526790",
    appId: "1:137574526790:web:71dae3de38f4ec29507f47",
    measurementId: "G-M8JPXTKLVP"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const chatRef = ref(db, 'heartwords-chat');

  const chatMessages = document.getElementById('chatMessages');
  onChildAdded(chatRef, (data) => {
    const msg = data.val();
    const myName = document.getElementById('chatName').value;
    const div = document.createElement('div');
    div.className = `chat-msg ${msg.name === myName ? 'you' : ''}`;
    div.innerHTML = `<b>${msg.name}</b>: ${msg.text} <br><small style="opacity:0.7">${msg.time}</small>`;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    if(chatMessages.innerText === "Connecting...") chatMessages.innerHTML = "";
  });

  window.sendChat = function() {
    const name = document.getElementById('chatName').value || "Anonymous";
    const text = document.getElementById('chatInput').value;
    if(!text) return;
    push(chatRef, {
      name: name,
      text: text,
      time: new Date().toLocaleTimeString()
    });
    document.getElementById('chatInput').value = "";
  }

  let poems = [
    {id: 1, title: "Heaven Sent", text: "You walked in like sunshine\nand made my grey days\nfeel like home."},
    {id: 2, title: "Empty Chair", text: "The chair is still warm\nbut you are not here."}
  ];
  function renderPoems() {
    document.getElementById('poemsGrid').innerHTML = poems.map(p => `
      <div class="poem-card">
        <h3 class="poem-title">${p.title}</h3>
        <div class="poem-text">${p.text}</div>
      </div>
    `).join('');
  }
  function showTab(id,el){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById(id).classList.add('active'); el.classList.add('active');
  }
  function addPoem(){ alert("Added locally") }
  
  renderPoems();
</script>
</body>
</html>
