<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heartwords - Premium Poetry + Chat + Voice</title>
<style>
  :root { --pink: #ff9ecb; --dark-pink: #e91e63; --gold: #FFD700; --bg: #fff5f9; }
  body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; color: #333; }
  header { background: linear-gradient(135deg, var(--pink), var(--dark-pink)); color: white; text-align: center; padding: 30px 20px; position: relative; }
 .premium-badge { position: absolute; top: 15px; right: 15px; background: var(--gold); color: #000; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

 .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
 .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
 .tab { padding: 10px 20px; border: 2px solid var(--dark-pink); border-radius: 20px; background: white; color: var(--dark-pink); cursor: pointer; font-weight: 600; }
 .tab.active { background: var(--dark-pink); color: white; }

 .poem-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(233,30,99,0.1); position: relative; }
 .poem-title { color: var(--dark-pink); font-size: 1.4em; margin: 0 0 5px; }
 .poem-author { color: #888; font-style: italic; margin-bottom: 15px; }
 .poem-text { white-space: pre-line; line-height: 1.8; }

 .heart-btn { position: absolute; top: 15px; right: 15px; font-size: 28px; cursor: pointer; color: #ddd; transition: all 0.3s; }
 .heart-btn:hover { transform: scale(1.3); }
 .heart-btn.active { color: var(--dark-pink); animation: pop 0.3s; }
  @keyframes pop { 50%{transform:scale(1.4)} }

 .word { cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: 0.2s; }
 .word:hover { background: #ffe0eb; }

 .section { display: none; }
 .section.active { display: block; }
 .empty { text-align: center; color: #999; padding: 50px 20px; }

  textarea, input, select { width: 100%; padding: 12px; border: 2px solid #ffd6e8; border-radius: 8px; margin-bottom: 10px; font-family: inherit; }
 .btn { background: var(--dark-pink); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-right: 10px; }
 .btn.premium { background: var(--gold); color: #000; }
 .btn.voice { background: #9c27b0; }

  /* CHAT + EMOJI */
 .chat-box { background: white; border-radius: 15px; padding: 15px; height: 400px; display: flex; flex-direction: column; }
 .chat-messages { flex: 1; overflow-y: auto; padding: 10px; background: #fff0f5; border-radius: 10px; margin-bottom: 10px; }
 .chat-msg { background: #ffe0eb; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; max-width: 80%; }
 .chat-msg.you { background: var(--dark-pink); color: white; margin-left: auto; }
 .chat-input { display: flex; gap: 10px; align-items: center; }
 .emoji-picker { display: none; position: absolute; background: white; border: 2px solid var(--pink); border-radius: 10px; padding: 10px; gap: 5px; flex-wrap: wrap; width: 250px; }
 .emoji { cursor: pointer; font-size: 24px; padding: 5px; }
 .emoji:hover { background: #ffe0eb; border-radius: 5px; }

 .poem-picture { width: 100%; border-radius: 15px; margin-top: 15px; }
</style>
</head>
<body>

<header>
  <div class="premium-badge">PREMIUM ✨</div>
  <h1>Heartwords</h1>
  <p>Save the words that touch your heart</p>
</header>

<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="showTab('poems', this)">Poems</div>
    <div class="tab" onclick="showTab('heartwords', this)">❤️ Heartwords</div>
    <div class="tab" onclick="showTab('confess', this)">💌 Confessions</div>
    <div class="tab" onclick="showTab('chat', this)">💬 Chat Room</div>
    <div class="tab" onclick="showTab('write', this)">Write</div>
  </div>

  <div id="poems" class="section active">
    <select id="categorySelect" onchange="filterByCategory()" style="margin-bottom:20px;">
      <option value="all">All Categories</option>
      <option value="love">Love</option>
      <option value="grief">Grief</option>
      <option value="healing">Healing</option>
      <option value="cute">Cute</option>
      <option value="motor">Motor</option>
    </select>
    <div id="poemsGrid"></div>
  </div>

  <div id="heartwords" class="section">
    <h2>Your Heartwords</h2>
    <button class="btn premium" onclick="exportPremium()">📥 Export Premium PDF</button>
    <div id="heartGrid"></div>
  </div>

  <div id="confess" class="section">
    <h2>Share Your Feelings 💌</h2>
    <textarea id="confessText" rows="4" placeholder="What's on your heart today..."></textarea>
    <button class="btn" onclick="postConfession()">Share Anonymously</button>
    <div id="confessGrid" style="margin-top:20px;"></div>
  </div>

  <div id="chat" class="section">
    <h2>Heartwords Chat Room 💬</h2>
    <div class="chat-box">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input" style="position:relative;">
        <input type="text" id="chatName" placeholder="Your nickname" maxlength="15">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChat()">
        <button class="btn" onclick="toggleEmoji()">😊</button>
        <button class="btn voice" onclick="startVoice()">🎤</button>
        <button class="btn" onclick="sendChat()">Send</button>
        <div class="emoji-picker" id="emojiPicker"></div>
      </div>
    </div>
  </div>

  <div id="write" class="section">
    <h2>Write a Poem</h2>
    <input type="text" id="title" placeholder="Poem Title">
    <input type="text" id="author" placeholder="Your Name">
    <select id="poemCategory">
      <option value="love">Love</option><option value="grief">Grief</option>
      <option value="healing">Healing</option><option value="cute">Cute</option><option value="motor">Motor</option>
    </select>
    <textarea id="text" rows="6" placeholder="Write your poem here..."></textarea>
    <button class="btn" onclick="addPoem()">Publish</button>
  </div>
</div>
